name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      OATS_REPO: ${{ github.workspace }}/../oats
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Clone oats for the release-example tests
        run: git clone --quiet https://github.com/oatschema/oats "$OATS_REPO"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest -q -rs

  lowest:
    runs-on: ubuntu-latest
    env:
      OATS_REPO: ${{ github.workspace }}/../oats
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Clone oats for the release-example tests
        run: git clone --quiet https://github.com/oatschema/oats "$OATS_REPO"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync python -c "import importlib.metadata as m; print('jsonschema-rs', m.version('jsonschema-rs'))"
      - run: uv run --no-sync pytest -q -rs
